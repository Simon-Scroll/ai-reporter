claims:
  - id: C1
    type: fact
    text: "GAO found that GSA and DoD rely on contractor representations in SAM, that almost 90 percent of companies with FY2025 federal contract activity represented that they did not use covered equipment, and that representation data was unavailable for about 3,800 companies."
    status: supported
    evidence:
      - E1
  - id: C2
    type: fact
    text: "The June 23, 2026 proposed FAR overhaul would remove FAR 52.204-8 Annual Representations and Certifications from SAM and require Section 889 representations by submission of an offer under proposed FAR 52.240-2."
    status: supported
    evidence:
      - E2
  - id: C3
    type: fact
    text: "Current DFARS 252.204-7017 still directs an offeror to use its annual representations and certifications in SAM under DFARS 252.204-7016."
    status: supported
    evidence:
      - E3
  - id: C4
    type: inference
    text: "The public records show a potential split between a proposed civilian FAR representation workflow and DoD's current annual-SAM workflow, but they do not yet establish how civilian purchase-card users would obtain equivalent current information after implementation."
    status: provisional
    evidence:
      - E1
      - E2
      - E3
  - id: C5
    type: fact
    text: "The current RFO FAR Part 4 model text keeps SAM as the primary method for entity-level representations and certifications, exempts micro-purchases using a governmentwide commercial purchase card from active SAM registration, and directs contracting officers to collect certain information at the offer when SAM registration is not required."
    status: supported
    evidence:
      - E4
  - id: C6
    type: fact
    text: "The current RFO FAR Part 40 model text places the Section 889 prohibition at FAR 40.202(d), requires provision 52.240-90 in all solicitations, and requires clause 52.240-91 in solicitations and contracts."
    status: supported
    evidence:
      - E5
  - id: C7
    type: fact
    text: "HHS's April 2026 civilian-agency deviation instructs contracting officers to rely on representations from offers when RFO language is used and warns that SAM system updates may lag policy updates."
    status: supported
    evidence:
      - E7
  - id: C8
    type: fact
    text: "GSA's January 2026 RGO class deviation applies to GSA contracting activities and procurements and directs the GSA workforce to use applicable RGO deviation text instead of the codified GSAR."
    status: supported
    evidence:
      - E6
  - id: C9
    type: inference
    text: "The official implementation records show a replacement compliance signal for ordinary solicitations—an offer-level representation—while leaving a public-record gap for the searchable current signal available to purchase-card users and for the disposition of displaced SAM representations."
    status: provisional
    evidence:
      - E4
      - E5
      - E6
      - E7
