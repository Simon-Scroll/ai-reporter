claims:
  - id: C1
    type: fact
    text: "GAO reports that NNSA's federal workforce fell by 236 employees, or 11.9 percent, from a peak of 1,991 early in FY2025 to 1,755 employees through the second quarter of FY2026."
    status: supported
    evidence:
      - E1
  - id: C2
    type: fact
    text: "The DOE/NNSA FY2026 Congressional Justification requests $555 million for Federal Salaries and Expenses and says that amount supports a federal staff of 2,003 FTEs."
    status: supported
    evidence:
      - E2
  - id: C3
    type: fact
    text: "The FY2026 request includes FTEs at the Savannah River Operations Office that were funded in FY2025 by DOE Environmental Management, reflecting a transfer of responsibility for the Savannah River Site."
    status: supported
    evidence:
      - E2
  - id: C4
    type: inference
    text: "The two official records differ by 248 positions on their face: 2,003 requested FTEs minus 1,755 reported employees."
    status: provisional
    evidence:
      - E1
      - E2
  - id: C5
    type: inference
    text: "The 248-position difference is not yet a publishable staffing shortfall because the records may use different dates, workforce definitions, or treatment of the Savannah River transfer."
    status: provisional
    evidence:
      - E1
      - E2
  - id: C6
    type: fact
    text: "NNSA says its Strategic Workforce Plan uses workload drivers to identify federal workforce needs through FY 2031 and serves as the basis of its staffing plan."
    status: supported
    evidence:
      - E4
  - id: C7
    type: inference
    text: "The 2,003-FTE figure is a forward-looking staffing-plan level, not a contemporaneous report of employees on board."
    status: supported
    evidence:
      - E2
      - E4
  - id: C8
    type: fact
    text: "NNSA's Savannah River Site contract requires a contractor staffing plan covering current workforce size, skills mix, future mission requirements, hiring, retention, and attrition."
    status: supported
    evidence:
      - E5
  - id: C9
    type: fact
    text: "NNSA's FY2025 Stockpile Stewardship and Management Plan distinguishes the federal workforce funded through Federal Salaries and Expenses from management-and-operating partners."
    status: supported
    evidence:
      - E6
  - id: C10
    type: inference
    text: "The official records reviewed leave the 2,003-FTE plan and GAO's 1,755-employee Q2 FY2026 count unreconciled, including whether the GAO count includes the 38 Savannah River Operations Office positions in the request."
    status: supported
    evidence:
      - E1
      - E2
      - E3
      - E4
      - E6
  - id: C11
    type: inference
    text: "The comparison is a public-record planning-to-headcount reconciliation gap, not proof of a staffing shortfall, mission failure, or statutory violation."
    status: supported
    evidence:
      - E1
      - E2
      - E4
      - E6
