      - "https://www.osmre.gov/sites/default/files/pdfs/5-100.pdf"
    locator: "OSMRE table footnotes; manual p. H-2, section 5-100-40(A)–(D)"
  - id: C6
    status: supported
    claim: "The records show a geographic concentration of recommendation-to-distribution differences but do not establish that those differences caused a particular inspection, reclamation, or environmental failure."
    sources:
