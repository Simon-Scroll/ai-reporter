name: persist-desk

# Cloud runs land on cursor/* branches. Main is the next run's memory.
# Auto-merge newsroom work, including published investigations after
# validation. HOLD still keeps published/ off main.
# GITHUB_TOKEN pushes do not trigger other workflows; pages.yml listens
# via workflow_run after this job succeeds.

on:
  push:
    branches:
      - "cursor/**"

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge onto main
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main..."$SHA")"
          echo "$changed"
          published="$(echo "$changed" | grep -E '^newsroom/published/.+\.md$' | grep -v '\.gitkeep$' || true)"
          hold=0
          if git cat-file -e "$SHA:newsroom/HOLD" 2>/dev/null; then hold=1; fi
          if git cat-file -e "origin/main:newsroom/HOLD" 2>/dev/null; then hold=1; fi
          if [ -n "$published" ] && [ "$hold" = 0 ]; then
            npm ci
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              node scripts/validate-article.mjs "$f"
            done <<< "$published"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-edit "$SHA"
          if [ -n "$published" ] && [ "$hold" = 1 ]; then
            echo "HOLD is set — keeping origin/main published/ off this merge."
            git rm -r --quiet newsroom/published
            git checkout origin/main -- newsroom/published
            if ! git diff --cached --quiet; then
              git commit -m "Keep published off main while HOLD is set"
            fi
          fi
          git push origin main
