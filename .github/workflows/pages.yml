name: pages

# Static site from newsroom/desk notes, watching pages, and
# newsroom/published investigations. persist-desk pushes main with
# GITHUB_TOKEN, which does not trigger a push workflow. Listen for
# persist-desk completion instead, and always build origin/main so a
# failed validation cannot go live.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["persist-desk"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix site install
      - run: npm --prefix site run build
        env:
          SITE_URL: https://simon-scroll.github.io
          BASE_PATH: /ai-reporter
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
